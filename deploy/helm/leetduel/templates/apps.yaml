{{- range $key, $app := .Values.apps }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $app.name }}
  labels:
    app.kubernetes.io/name: {{ $app.name }}
    {{- include "leetduel.labels" $ | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $app.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $app.name }}
        {{- include "leetduel.labels" $ | nindent 8 }}
    spec:
      {{- if $app.dispatcher }}
      serviceAccountName: judge-dispatcher
      {{- end }}
      containers:
        - name: {{ $app.name }}
          image: {{ printf "%s%s:%s" $.Values.images.registry $app.image $.Values.images.tag | quote }}
          imagePullPolicy: {{ $.Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $app.port }}
              protocol: TCP
          env:
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
            {{- if $app.database }}
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgresql:5432/leetduel
            - name: SPRING_DATASOURCE_USERNAME
              value: leetduel
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.secretName }}
                  key: password
            {{- end }}
            {{- if $app.rabbit }}
            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq
            - name: SPRING_RABBITMQ_PORT
              value: "5672"
            - name: SPRING_RABBITMQ_USERNAME
              value: leetduel
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.secretName }}
                  key: rabbitmq-password
            {{- end }}
            {{- if $app.redis }}
            - name: SPRING_DATA_REDIS_HOST
              value: redis-master
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.secretName }}
                  key: redis-password
            {{- end }}
            {{- if $app.jwt }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.secretName }}
                  key: jwt-secret
            {{- end }}
            {{- range $environment := $app.env }}
            - name: {{ $environment.name }}
              {{- if hasKey $environment "valueFrom" }}
              valueFrom:
                {{- toYaml $environment.valueFrom | nindent 16 }}
              {{- else }}
              value: {{ $environment.value | quote }}
              {{- end }}
            {{- end }}
            {{- if eq $app.name "auth-service" }}
            - name: FRONTEND_BASE_URL
              value: {{ printf "%s://%s" $.Values.global.ingress.scheme $.Values.global.ingress.host | quote }}
            - name: VERIFICATION_LINK_BASE
              value: {{ printf "%s://%s/api/auth/verify-email" $.Values.global.ingress.scheme $.Values.global.ingress.host | quote }}
            {{- end }}
            {{- if eq $app.name "judge-dispatcher" }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- end }}
          resources:
            {{- toYaml $app.resources | nindent 12 }}
          {{- if $app.frontend }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          {{- else }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $app.name }}
  labels:
    app.kubernetes.io/name: {{ $app.name }}
    {{- include "leetduel.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $app.name }}
  ports:
    - name: http
      port: {{ $app.port }}
      targetPort: http
      protocol: TCP
---
{{- end }}
