apiVersion: v1
kind: ServiceAccount
metadata:
  name: judge-dispatcher
  labels:
    {{- include "leetduel.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: judge-dispatcher
  labels:
    {{- include "leetduel.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: judge-dispatcher
  labels:
    {{- include "leetduel.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: judge-dispatcher
roleRef:
  kind: Role
  name: judge-dispatcher
  apiGroup: rbac.authorization.k8s.io
