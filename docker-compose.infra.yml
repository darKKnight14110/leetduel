services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: leetduel
      POSTGRES_PASSWORD: leetduel_dev
      POSTGRES_DB: leetduel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@leetduel.com
      PGADMIN_DEFAULT_PASSWORD: leetduel_dev
    ports:
      - "5050:80"
    depends_on:
      - postgres

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: leetduel
      MONGO_INITDB_ROOT_PASSWORD: leetduel_dev
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mongo-express:
    image: mongo-express
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: leetduel
      ME_CONFIG_MONGODB_ADMINPASSWORD: leetduel_dev
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH_USERNAME: leetduel
      ME_CONFIG_BASICAUTH_PASSWORD: leetduel_dev
    ports:
      - "8081:8081"
    depends_on:
      - mongo

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    depends_on:
      - redis

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: leetduel
      RABBITMQ_DEFAULT_PASS: leetduel_dev
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq


  # First app service that runs containerized rather than as a plain local
  # JVM process (see the Phase 1 plan's explicit call to containerize Judge
  # Worker ahead of the rest of the stack). SPRING_RABBITMQ_HOST overrides
  # the localhost default in application.properties, which stays there so
  # `./gradlew bootRun` still works for fast local iteration outside
  # compose. The docker.sock bind mount is what makes every sandbox
  # container Judge Worker creates a SIBLING, not a child - see
  # DockerSandboxService's use of copyArchiveToContainerCmd instead of
  # host-path bind mounts, which is the direct consequence of that. Named
  # security trade-off (root-equivalent host Docker control from inside
  # this one container) lives in the Dockerfile and the Phase 1 plan -
  # accepted for a dev-only deployment, not production-multi-tenant-safe.
  judge-worker:
    build: ./services/judge-worker
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
    ports:
      - "8087:8087"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - rabbitmq

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  rabbitmq_data:
