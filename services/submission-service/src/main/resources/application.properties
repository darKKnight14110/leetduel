spring.application.name=submission-service

# 8082-8085 taken (auth/user/gateway/problem). 8086 = submission-service.
server.port=8086

spring.datasource.url=jdbc:postgresql://localhost:5432/leetduel
spring.datasource.username=leetduel
spring.datasource.password=leetduel_dev

spring.flyway.enabled=true
spring.flyway.schemas=submission
spring.flyway.default-schema=submission
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=submission
spring.jpa.open-in-view=false

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=leetduel
spring.rabbitmq.password=leetduel_dev

# Direct exchange, not topic - exactly one consumer group (the Judge Worker
# pool) ever wants a job message; a topic exchange's value is multi-queue
# fanout, which doesn't apply here. Contrast with judge-events-exchange
# below.
leetduel.events.judge-jobs-exchange=judge.jobs.exchange
leetduel.events.judge-jobs-routing-key=judge.job.created

# Topic exchange even with one consumer today (this service) - Phase 3's
# Duel Service will also need to react to submission.judged for match
# progress, and that's a new bound queue with zero topology change here.
leetduel.events.judge-events-exchange=judge.events
leetduel.events.submission-judged-queue=submission.judged-status
leetduel.events.submission-judged-routing-key=submission.judged

# Same trade-off as auth-service's outbox: polling, not CDC/Debezium - see
# OutboxRelay there for the full reasoning.
leetduel.outbox.poll-interval-ms=2000

leetduel.problem-service.base-url=http://localhost:8085
