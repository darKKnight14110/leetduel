spring.application.name=submission-service

# 8082-8085 taken (auth/user/gateway/problem). 8086 = submission-service.
server.port=8086

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/leetduel}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:leetduel}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:leetduel_dev}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:8}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:2000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.leak-detection-threshold=${DB_POOL_LEAK_DETECTION_MS:0}

spring.flyway.enabled=true
spring.flyway.schemas=submission
spring.flyway.default-schema=submission
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=submission
spring.jpa.open-in-view=false

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:leetduel}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:leetduel_dev}

# Direct exchange, not topic - exactly one consumer group (the Judge Worker
# pool) ever wants a job message; a topic exchange's value is multi-queue
# fanout, which doesn't apply here. Contrast with judge-events-exchange
# below.
leetduel.events.judge-jobs-exchange=judge.jobs.exchange
leetduel.events.judge-jobs-routing-key=judge.job.created

# Topic exchange even with one consumer today (this service) - Phase 3's
# Duel Service will also need to react to submission.judged for match
# progress, and that's a new bound queue with zero topology change here.
leetduel.events.judge-events-exchange=judge.events
leetduel.events.submission-judged-queue=submission.judged-status
leetduel.events.submission-judged-routing-key=submission.judged
leetduel.events.practice-exchange=practice.events

# Same trade-off as auth-service's outbox: polling, not CDC/Debezium - see
# OutboxRelay there for the full reasoning.
leetduel.outbox.poll-interval-ms=2000

leetduel.problem-service.base-url=${PROBLEM_SERVICE_BASE_URL:http://localhost:8085}
