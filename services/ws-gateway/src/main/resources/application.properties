spring.application.name=ws-gateway

# 8082-8089 taken. 8090 = ws-gateway. Standalone, direct-connect - NOT
# proxied through the existing Gateway (see docs/goals.md's Phase 3 plan
# for why: that Gateway is a hand-rolled WebFlux HTTP proxy with zero
# WebSocket-upgrade support).
server.port=8090

# Verify-only, never issue - same shared secret as auth-service/gateway.
jwt.secret=${JWT_SECRET:dev-only-secret-do-not-use-in-production-change-me-32bytes-min}

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:leetduel}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:leetduel_dev}

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}

# match.events - matchmaking-service (match.created) and duel-service
# (duel.progress, match.completed) both publish here; this service binds
# ONE queue with three separate bindings (one per routing key), same
# "declare your own queue against someone else's exchange" pattern every
# cross-service consumer in this repo uses.
leetduel.events.match-events-exchange=match.events
leetduel.events.ws-gateway-queue=ws-gateway.match-events
leetduel.events.match-created-routing-key=match.created
leetduel.events.duel-progress-routing-key=duel.progress
leetduel.events.match-completed-routing-key=match.completed

# Redis Pub/Sub channel used ONLY to fan an already-consumed RabbitMQ event
# out to every WS Gateway instance's local STOMP SimpleBroker - see
# docs/goals.md's Phase 3 plan for the full reasoning on why this hop
# exists (RabbitMQ delivers to exactly one instance; the two connected
# players might be on two different ones).
leetduel.ws.fanout-channel=ws-gateway.fanout
