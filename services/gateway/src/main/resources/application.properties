spring.application.name=gateway

# 8080/8081/8082/8083 all taken (see auth-service/user-service application.properties
# for the first two; auth-service=8082, user-service=8083). 8084 = gateway.
server.port=8084

# Same HS256/384 shared secret as auth-service - see JwtService's comment
# there on why a shared secret (not RS256 asymmetric) is a defensible choice
# specifically because this Gateway is the only other party ever verifying
# these tokens. If that stops being true (a third service starts verifying
# tokens independently, or tokens ever need to cross a trust boundary this
# stack doesn't control), that's the point to revisit HS->RS.
jwt.secret=${JWT_SECRET:dev-only-secret-do-not-use-in-production-change-me-32bytes-min}

# Same reasoning and property name as auth-service's CORS bean (see
# SecurityConfig.java there) - a browser at localhost:3000 calling this
# Gateway directly for /problems and /submissions needs the exact same fix,
# just wired via the reactive CorsWebFilter instead of Spring Security's
# servlet-based .cors() DSL (see config/CorsConfig.java).
leetduel.cors.allowed-origin=${FRONTEND_BASE_URL:http://localhost:3000}

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}

# Route table: request path prefix -> upstream base URL. Forwarded as-is
# (no prefix stripping) because every downstream controller is already
# mapped at this same prefix (AuthController is @RequestMapping("/auth")) -
# stripping and re-adding it here would just be extra indirection.
leetduel.gateway.routes[0].path=/auth
leetduel.gateway.routes[0].uri=${LEETDUEL_AUTH_URI:http://localhost:8082}
leetduel.gateway.routes[1].path=/users
leetduel.gateway.routes[1].uri=${LEETDUEL_USER_URI:http://localhost:8083}
leetduel.gateway.routes[2].path=/problems
leetduel.gateway.routes[2].uri=${LEETDUEL_PROBLEM_URI:http://localhost:8085}
leetduel.gateway.routes[3].path=/submissions
leetduel.gateway.routes[3].uri=${LEETDUEL_SUBMISSION_URI:http://localhost:8086}
leetduel.gateway.routes[4].path=/matchmaking
leetduel.gateway.routes[4].uri=${LEETDUEL_MATCHMAKING_URI:http://localhost:8088}
# Phase 3: Duel Service's public REST surface (GET /duels/{matchId}) - the
# frontend's initial-load / reconnect-recovery path, per docs/goals.md.
# ws-gateway is NOT routed here - it's standalone/direct-connect, since
# this Gateway's ProxyWebFilter has no WebSocket-upgrade support.
leetduel.gateway.routes[5].path=/duels
leetduel.gateway.routes[5].uri=${LEETDUEL_DUEL_URI:http://localhost:8089}
# Phase 4: Leaderboard Service - a pure read-projection over match.completed,
# holds no source-of-truth data of its own (see docs/goals.md). Its three
# endpoints are also the only entries below whose PURPOSE is to be public,
# not just auth infrastructure - see the public-paths block's comment.
leetduel.gateway.routes[6].path=/leaderboard
leetduel.gateway.routes[6].uri=${LEETDUEL_LEADERBOARD_URI:http://localhost:8091}
leetduel.gateway.routes[7].path=/practice
leetduel.gateway.routes[7].uri=${LEETDUEL_PRACTICE_URI:http://localhost:8092}

# Exact-match allowlist, not a wildcard pattern - these are the only
# endpoints whose entire job is to ISSUE or refresh trust (signup/login/
# refresh) or recover it (verify/resend/forgot/reset), so they can't
# require a token to already exist. Everything else needs one. Kept as a
# flat list rather than "any /auth/* is public" so a new authenticated
# /auth/** endpoint added later doesn't silently become public by default.
leetduel.gateway.public-paths[0]=/auth/signup
leetduel.gateway.public-paths[1]=/auth/login
leetduel.gateway.public-paths[2]=/auth/refresh
leetduel.gateway.public-paths[3]=/auth/logout
leetduel.gateway.public-paths[4]=/auth/verify-email
leetduel.gateway.public-paths[5]=/auth/resend-verification
leetduel.gateway.public-paths[6]=/auth/forgot-password
leetduel.gateway.public-paths[7]=/auth/reset-password
leetduel.gateway.public-paths[8]=/actuator/health
# Phase 4: leaderboard rankings are treated as public data (same as most
# competitive platforms), a different reason for being on this list than
# every /auth/** entry above - those are public because they issue/recover
# trust, these are public because the data itself has no confidentiality
# requirement. Flat exact-match entries, same reasoning as the /auth/**
# block: a future authenticated /leaderboard/** endpoint doesn't silently
# become public by inheriting a prefix rule.
leetduel.gateway.public-paths[9]=/leaderboard/top
leetduel.gateway.public-paths[10]=/leaderboard/rank
leetduel.gateway.public-paths[11]=/leaderboard/around
leetduel.gateway.public-paths[12]=/users/public-identities

# Token bucket, atomic via a single Redis Lua EVAL (see
# scripts/token_bucket.lua and RateLimitWebFilter for the full reasoning).
# capacity=20 means a client can burst up to 20 requests instantly (e.g.
# after being idle); refill-tokens-per-second=0.333 (20/60) means the
# steady-state average matches the old 20-per-60s limit exactly - same
# nominal rate as before, but bursts are capped precisely at 20 instead of
# the ~2x-at-a-window-boundary a fixed window allowed, and the bucket
# state (Hash: tokens + last-refill-ts) lives under one key per client, so
# this is safe to point at a real Redis Cluster with zero code changes.
leetduel.gateway.rate-limit.capacity=20
leetduel.gateway.rate-limit.refill-tokens-per-second=0.333
