spring.application.name=gateway

# 8080/8081/8082/8083 all taken (see auth-service/user-service application.properties
# for the first two; auth-service=8082, user-service=8083). 8084 = gateway.
server.port=8084

# Same HS256/384 shared secret as auth-service - see JwtService's comment
# there on why a shared secret (not RS256 asymmetric) is a defensible choice
# specifically because this Gateway is the only other party ever verifying
# these tokens. If that stops being true (a third service starts verifying
# tokens independently, or tokens ever need to cross a trust boundary this
# stack doesn't control), that's the point to revisit HS->RS.
jwt.secret=${JWT_SECRET:dev-only-secret-do-not-use-in-production-change-me-32bytes-min}

# Same reasoning and property name as auth-service's CORS bean (see
# SecurityConfig.java there) - a browser at localhost:3000 calling this
# Gateway directly for /problems and /submissions needs the exact same fix,
# just wired via the reactive CorsWebFilter instead of Spring Security's
# servlet-based .cors() DSL (see config/CorsConfig.java).
leetduel.cors.allowed-origin=${FRONTEND_BASE_URL:http://localhost:3000}

spring.data.redis.host=localhost
spring.data.redis.port=6379

# Route table: request path prefix -> upstream base URL. Forwarded as-is
# (no prefix stripping) because every downstream controller is already
# mapped at this same prefix (AuthController is @RequestMapping("/auth")) -
# stripping and re-adding it here would just be extra indirection.
leetduel.gateway.routes[0].path=/auth
leetduel.gateway.routes[0].uri=http://localhost:8082
leetduel.gateway.routes[1].path=/users
leetduel.gateway.routes[1].uri=http://localhost:8083
leetduel.gateway.routes[2].path=/problems
leetduel.gateway.routes[2].uri=http://localhost:8085
leetduel.gateway.routes[3].path=/submissions
leetduel.gateway.routes[3].uri=http://localhost:8086

# Exact-match allowlist, not a wildcard pattern - these are the only
# endpoints whose entire job is to ISSUE or refresh trust (signup/login/
# refresh) or recover it (verify/resend/forgot/reset), so they can't
# require a token to already exist. Everything else needs one. Kept as a
# flat list rather than "any /auth/* is public" so a new authenticated
# /auth/** endpoint added later doesn't silently become public by default.
leetduel.gateway.public-paths[0]=/auth/signup
leetduel.gateway.public-paths[1]=/auth/login
leetduel.gateway.public-paths[2]=/auth/refresh
leetduel.gateway.public-paths[3]=/auth/logout
leetduel.gateway.public-paths[4]=/auth/verify-email
leetduel.gateway.public-paths[5]=/auth/resend-verification
leetduel.gateway.public-paths[6]=/auth/forgot-password
leetduel.gateway.public-paths[7]=/auth/reset-password
leetduel.gateway.public-paths[8]=/actuator/health

# Fixed-window counter (INCR+EXPIRE in Redis), not a token bucket or
# sliding-window log - allows a burst right at a window boundary (worst
# case ~2x the nominal rate for a moment), which a sliding-window
# implementation would smooth out at the cost of more Redis calls/state per
# request. Acceptable v1 trade-off: this gateway's job here is stopping
# unbounded brute-force/spam on public auth endpoints, not perfectly
# metering traffic.
leetduel.gateway.rate-limit.requests-per-window=20
leetduel.gateway.rate-limit.window-seconds=60
