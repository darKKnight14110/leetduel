spring.application.name=leaderboard-service

# 8082-8090 taken (auth/user/gateway/problem/submission/judge-worker/matchmaking/duel/ws-gateway). 8091 = leaderboard-service.
server.port=8091

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=leetduel
spring.rabbitmq.password=leetduel_dev

spring.data.redis.host=localhost
spring.data.redis.port=6379

# match.events - matchmaking-service (match.created) and duel-service
# (duel.progress, match.completed) are the producers; this service only
# ever cares about match.completed, same "redeclare the exchange, bind your
# own queue" pattern every cross-service consumer in this repo uses (see
# user-service's/ws-gateway's own RabbitConfig).
leetduel.events.match-events-exchange=match.events
leetduel.events.match-completed-routing-key=match.completed
leetduel.events.leaderboard-match-completed-queue=leaderboard.match-completed

leetduel.leaderboard.top.default-limit=50
leetduel.leaderboard.top.max-limit=200
leetduel.leaderboard.rank-window.default-size=5
leetduel.leaderboard.rank-window.max-size=50

# Must outlive realistic RabbitMQ redelivery windows (broker restart +
# requeue) - see IncrementScoreLuaScriptIT and LeaderboardService's comment
# on why ZINCRBY (unlike the global board's ZADD) needs this guard at all.
leetduel.leaderboard.idempotency-marker-ttl-seconds=604800
# Set once per period key (EXPIRE ... NX - see increment_period_score.lua),
# well past that key's own natural lifetime, so the leaderboard is still
# queryable for a while after a week/quarter ends without growing forever.
leetduel.leaderboard.weekly-key-ttl-seconds=1209600
leetduel.leaderboard.season-key-ttl-seconds=10368000
