spring.application.name=practice-intelligence-service
server.port=8092

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/leetduel}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:leetduel}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:leetduel_dev}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:8}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:2000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.leak-detection-threshold=${DB_POOL_LEAK_DETECTION_MS:0}
spring.flyway.enabled=true
spring.flyway.schemas=practice
spring.flyway.default-schema=practice
spring.jdbc.template.fetch-size=100

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:leetduel}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:leetduel_dev}

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}

leetduel.events.practice-exchange=practice.events
leetduel.events.practice-queue=practice-intelligence.completed
leetduel.events.practice-routing-key=practice.submission.completed
leetduel.problem-service.base-url=${PROBLEM_SERVICE_BASE_URL:http://localhost:8085}
leetduel.practice.recommendation-cache-seconds=600
leetduel.practice.max-recommendations=6
leetduel.practice.max-candidates=500
leetduel.practice.explanation-retention-days=14

nvidia.api-base=${NVIDIA_API_BASE:https://integrate.api.nvidia.com/v1}
nvidia.api-key=${NVIDIA_API_KEY:}
nvidia.embedding-model=${NVIDIA_EMBEDDING_MODEL:nvidia/nemotron-3-embed-1b}
nvidia.explanation-model=${NVIDIA_EXPLANATION_MODEL:nvidia/nemotron-3-super-120b-a12b}
nvidia.embedding-dimensions=${NVIDIA_EMBEDDING_DIMENSIONS:2048}
nvidia.max-attempts=${NVIDIA_MAX_ATTEMPTS:3}
