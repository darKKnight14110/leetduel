spring.application.name=auth-service

# 8080 taken by an unrelated local process, 8081 taken by Docker Desktop's
# WSL relay - both pre-existing on this machine, not Spring/Gradle. Each
# service gets its own fixed port for local dev anyway. auth-service = 8082.
server.port=8082

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/leetduel}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:leetduel}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:leetduel_dev}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:8}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:2000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.leak-detection-threshold=${DB_POOL_LEAK_DETECTION_MS:0}

# Flyway owns schema creation/evolution. Hibernate is set to validate-only so it
# checks the entity mappings match the DB but never issues DDL itself - two
# tools both auto-generating schema is how you get silent drift in prod.
spring.flyway.enabled=true
spring.flyway.schemas=auth
spring.flyway.default-schema=auth
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=auth
spring.jpa.open-in-view=false

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:leetduel}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:leetduel_dev}

leetduel.events.user-exchange=user.events
# Outbox relay poll interval. Trade-off vs CDC/Debezium documented on OutboxRelay.
leetduel.outbox.poll-interval-ms=2000

# HS256 shared secret. ${JWT_SECRET:...} - same env-var-override pattern as
# every other secret in this file (DB/RabbitMQ passwords, Gmail credentials
# below) - a bare literal here was the one gap a security
# review caught: this repo is a public portfolio project, so a committed
# literal with no override hook would sign real tokens with a
# publicly-known key the moment this ever got deployed without someone
# separately wiring in a real secret. RS256 (asymmetric) would be the
# stronger choice if a third party ever needed to verify tokens without
# holding a shared secret, but only this stack's own Gateway verifies these
# tokens, so a shared secret is a defensible v1 choice, not a shortcut taken
# silently.
jwt.secret=${JWT_SECRET:dev-only-secret-do-not-use-in-production-change-me-32bytes-min}
# 15 minutes, down from the old 24h now that a refresh token exists to renew
# it. A stolen access token can't be revoked before it expires (stateless
# verify is the point of it) - shortening this shrinks that exposure window
# down to something a leaked-token incident can actually tolerate. The
# refresh token below is what carries the actual 30-day session.
jwt.expiration-ms=900000
# 30 days, revocable server-side (auth.refresh_tokens) unlike the access
# token above - see RefreshTokenService for rotation/reuse-detection.
jwt.refresh-expiration-ms=2592000000

# Real Gmail SMTP, per-project decision (dev is meant to hit the actual
# inbox, not a local catch-all like Mailpit). Use an app password
# (Google Account > Security > 2-Step Verification > App passwords), never
# the account's real password - see spring.mail.password below.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Verification remains an API endpoint, while password-reset links target the
# deployed frontend. Override both bases when the UI is not on localhost.
leetduel.email.verification-link-base=${VERIFICATION_LINK_BASE:http://localhost:8082/auth/verify-email}
leetduel.email.reset-link-base=${FRONTEND_BASE_URL:http://localhost:3000}/reset-password

# Same origin as FRONTEND_BASE_URL above, separate property because it
# means something different to Spring Security than it does to EmailService
# (a CORS allow-list entry, not a link target) - one env var, two config
# keys, each documenting its own reason for existing.
leetduel.cors.allowed-origin=${FRONTEND_BASE_URL:http://localhost:3000}
