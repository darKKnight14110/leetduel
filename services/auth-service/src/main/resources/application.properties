spring.application.name=auth-service

# 8080 taken by an unrelated local process, 8081 taken by Docker Desktop's
# WSL relay - both pre-existing on this machine, not Spring/Gradle. Each
# service gets its own fixed port for local dev anyway. auth-service = 8082.
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/leetduel
spring.datasource.username=leetduel
spring.datasource.password=leetduel_dev

# Flyway owns schema creation/evolution. Hibernate is set to validate-only so it
# checks the entity mappings match the DB but never issues DDL itself - two
# tools both auto-generating schema is how you get silent drift in prod.
spring.flyway.enabled=true
spring.flyway.schemas=auth
spring.flyway.default-schema=auth
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=auth
spring.jpa.open-in-view=false

