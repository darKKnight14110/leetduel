spring.application.name=user-service

# 8080/8081/8082 taken by other local processes on this machine. 8083 = user-service.
server.port=8083

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/leetduel}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:leetduel}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:leetduel_dev}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:8}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:2000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.leak-detection-threshold=${DB_POOL_LEAK_DETECTION_MS:0}

spring.flyway.enabled=true
spring.flyway.schemas=profile
spring.flyway.default-schema=profile
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=profile
spring.jpa.open-in-view=false

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:leetduel}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:leetduel_dev}

# Must match auth-service's leetduel.events.user-exchange - same broker
# topology, declared independently by each side (RabbitMQ dedups identical
# declarations, so declaration order between the two services doesn't matter).
leetduel.events.user-exchange=user.events
leetduel.events.user-created-queue=profile.user-created

# match.events - matchmaking-service/duel-service's topic exchange. This
# service only binds match.completed, to apply the ELO delta and duel W/L/D
# counters (sole writer of ELO - see docs/goals.md).
leetduel.events.match-events-exchange=match.events
leetduel.events.match-completed-queue=profile.match-completed
leetduel.events.match-completed-routing-key=match.completed
