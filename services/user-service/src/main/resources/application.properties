spring.application.name=user-service

# 8080/8081/8082 taken by other local processes on this machine. 8083 = user-service.
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/leetduel
spring.datasource.username=leetduel
spring.datasource.password=leetduel_dev

spring.flyway.enabled=true
spring.flyway.schemas=profile
spring.flyway.default-schema=profile
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=profile
spring.jpa.open-in-view=false

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=leetduel
spring.rabbitmq.password=leetduel_dev

# Must match auth-service's leetduel.events.user-exchange - same broker
# topology, declared independently by each side (RabbitMQ dedups identical
# declarations, so declaration order between the two services doesn't matter).
leetduel.events.user-exchange=user.events
leetduel.events.user-created-queue=profile.user-created

# match.events - matchmaking-service/duel-service's topic exchange. This
# service only binds match.completed, to apply the ELO delta and duel W/L/D
# counters (sole writer of ELO - see docs/goals.md).
leetduel.events.match-events-exchange=match.events
leetduel.events.match-completed-queue=profile.match-completed
leetduel.events.match-completed-routing-key=match.completed

