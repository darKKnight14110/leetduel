spring.application.name=duel-service

# 8082-8088 taken (auth/user/gateway/problem/submission/judge-worker/matchmaking). 8089 = duel-service.
server.port=8089

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/leetduel}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:leetduel}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:leetduel_dev}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:8}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:2000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.leak-detection-threshold=${DB_POOL_LEAK_DETECTION_MS:0}

# Flyway owns schema creation/evolution, Hibernate validate-only - same
# convention as every other service.
spring.flyway.enabled=true
spring.flyway.schemas=duel
spring.flyway.default-schema=duel
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=duel
spring.jpa.open-in-view=false

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:leetduel}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:leetduel_dev}

# Same match.events topic exchange matchmaking-service publishes to - this
# service only ever declares its own queue/bindings against it, never the
# exchange's producer-side config. Two independent bindings on one queue:
# match.created (start a match) and, on the OTHER binding, this service is
# itself a PRODUCER of duel.progress/match.completed (see OutboxRelay).
leetduel.events.match-events-exchange=match.events
leetduel.events.match-created-routing-key=match.created
leetduel.events.duel-service-match-created-queue=duel.match-created

# judge.events topic exchange - Judge Worker's producer side, unchanged by
# this binding (see judge-worker's own RabbitConfig comment anticipating
# exactly this). Filters matchId != null in the listener itself; practice
# submissions are never routed differently, just ignored here.
leetduel.events.judge-events-exchange=judge.events
leetduel.events.submission-judged-routing-key=submission.judged
leetduel.events.duel-service-submission-judged-queue=duel.submission-judged

leetduel.events.duel-progress-routing-key=duel.progress
leetduel.events.match-completed-routing-key=match.completed

leetduel.outbox.poll-interval-ms=2000

# Sweep cadence for closing matches past their time limit - same interval as
# matchmaking-service's own sweep, no particular reason to differ.
leetduel.duel.sweep.fixed-delay-ms=1000

# Standard chess.com/League-style K-factor - see docs/goals.md.
leetduel.duel.elo.k-factor=32
