spring.application.name=judge-worker
spring.profiles.default=docker

# 8082-8086 taken (auth/user/gateway/problem/submission). 8087 = judge-worker.
# No client-facing routes exist here though - this port is actuator/health
# only, since Judge Worker is stateless and exposes no query endpoint. See
# the Gateway's application.properties: there is deliberately no route to
# this service.
server.port=8087

leetduel.events.judge-jobs-exchange=judge.jobs.exchange
leetduel.events.judge-jobs-queue=judge.jobs
leetduel.events.judge-jobs-routing-key=judge.job.created
leetduel.events.judge-events-exchange=judge.events
leetduel.events.submission-judged-routing-key=submission.judged

# Referenced by tag, not built here - see scripts/build-sandbox-images.ps1.
leetduel.sandbox.python-image=leetduel-sandbox-python:dev
leetduel.sandbox.java-image=leetduel-sandbox-java:dev
leetduel.sandbox.json-lib-path=/opt/judge-libs/json.jar

# Resource limits applied to every sandbox container at create time (see
# DockerSandboxService) - memory in bytes, one full CPU core in nanoCPUs.
leetduel.sandbox.memory-bytes=268435456
leetduel.sandbox.nano-cpus=1000000000
leetduel.sandbox.pids-limit=64

# Second-layer, hard safety net on top of the in-container `timeout <n>s`
# wrapper - if the exec call itself hasn't returned within (problem's
# time_limit_ms + this buffer), the container is force-killed. Never trust
# one kill mechanism alone.
leetduel.sandbox.timeout-buffer-ms=2000
# Independent of any single test case's limit - guards against a
# pathological test-suite size hanging a worker thread indefinitely. A
# submission that hits this maps to INTERNAL_ERROR, not TIME_LIMIT_EXCEEDED
# - it signals the judging pipeline broke, not that the user's code was slow.
leetduel.sandbox.overall-ceiling-ms=30000
