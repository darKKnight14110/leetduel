plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.leetduel'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-amqp'
	// No Postgres/Flyway/JPA - Judge Worker is deliberately stateless, see
	// the Phase 1 plan's "no MongoDB" decision. webmvc is pulled in only
	// for actuator/health - this service has no client-facing endpoints.
	implementation 'com.github.docker-java:docker-java-core:3.7.0'
	implementation 'com.github.docker-java:docker-java-transport-zerodep:3.7.0'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	// Test-only: real org.json jar, matching what docker/sandbox-java/Dockerfile vendors into the image.
	// JavaHarnessGeneratorTest compiles+runs generated Main.java against this for real, not a mock.
	testImplementation 'org.json:json:20251224'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	systemProperty 'user.timezone', 'UTC'
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs << "-Xlint:deprecation"
}
