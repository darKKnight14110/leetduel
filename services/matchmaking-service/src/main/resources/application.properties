spring.application.name=matchmaking-service

# 8082-8087 taken (auth/user/gateway/problem/submission/judge-worker). 8088 = matchmaking-service.
server.port=8088

spring.datasource.url=jdbc:postgresql://localhost:5432/leetduel
spring.datasource.username=leetduel
spring.datasource.password=leetduel_dev

# Flyway owns schema creation/evolution, Hibernate validate-only - same
# convention as every other service (see problem-service's comment on this).
spring.flyway.enabled=true
spring.flyway.schemas=matchmaking
spring.flyway.default-schema=matchmaking
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=matchmaking
spring.jpa.open-in-view=false

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=leetduel
spring.rabbitmq.password=leetduel_dev

spring.data.redis.host=localhost
spring.data.redis.port=6379

# Direct exchange - exactly one consumer group (this service's own
# JoinRequestListener) ever wants a join-request message, same reasoning as
# submission-service's judge.jobs.exchange.
leetduel.events.matchmaking-jobs-exchange=matchmaking.jobs.exchange
leetduel.events.matchmaking-join-queue=matchmaking.join
leetduel.events.matchmaking-join-routing-key=join.requested

# Topic exchange, producer-only here - Duel/WS Gateway/Leaderboard Services
# (Phase 3+) each declare their own queue and binding against this same
# exchange independently, exactly like submission-service binds its own
# queue to Judge Worker's judge.events without Judge Worker knowing about it.
leetduel.events.match-events-exchange=match.events
leetduel.events.match-created-routing-key=match.created

leetduel.outbox.poll-interval-ms=2000

leetduel.user-service.base-url=http://localhost:8083
leetduel.problem-service.base-url=http://localhost:8085

# Expanding-window ELO pairing - base/growth/cap are config, not magic
# numbers baked into the scheduler. base-elo = window half-width at 0s
# waited. growth-elo-per-second = how much wider per second waited.
# cap-elo = hard ceiling so a long-waiting user is never matched against
# literally anyone regardless of rating gap.
leetduel.matchmaking.window.base-elo=50
leetduel.matchmaking.window.growth-elo-per-second=10
leetduel.matchmaking.window.cap-elo=400

# Resolves goals.md's open question: a join waiting longer than this is
# swept out and marked EXPIRED. 120s is a demoable value for a portfolio
# project's live demo, not a load-tested production figure.
leetduel.matchmaking.max-wait-ms=120000

# How long an EXPIRED marker survives in Redis - long enough for one more
# status poll, short enough that this ephemeral (non-durable) structure
# self-cleans rather than accumulating forever.
leetduel.matchmaking.expired-marker-ttl-seconds=60

# WAITING marker safety-net TTL = max-wait + slack, so a status key never
# outlives the point past which the user would have expired anyway, even
# if every instance crashed before running the expiry sweep on them.
leetduel.matchmaking.waiting-status-ttl-seconds=150

leetduel.matchmaking.sweep.fixed-delay-ms=1000

# Duel time limit is a Matchmaking Service concept (how long the eventual
# duel lasts), independent of any one problem's own judge time_limit_ms
# (a per-test-case execution bound) - NOT sourced from problem-service.
leetduel.matchmaking.duel-time-limit-ms=1200000
