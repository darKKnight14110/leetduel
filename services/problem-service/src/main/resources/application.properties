spring.application.name=problem-service

# 8082-8084 taken (auth/user/gateway - see their own application.properties).
# 8085 = problem-service.
server.port=8085

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/leetduel}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:leetduel}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:leetduel_dev}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:8}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:2000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.leak-detection-threshold=${DB_POOL_LEAK_DETECTION_MS:0}

# Same Flyway-owns-schema / Hibernate-validate-only split as every other
# service in this repo - see auth-service's application.properties for why.
spring.flyway.enabled=true
spring.flyway.schemas=problem
spring.flyway.default-schema=problem
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=problem
spring.jpa.open-in-view=false
